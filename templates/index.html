{% extends "base.html" %}
{% block title %}New Screening — RetinaScan{% endblock %}

{% block content %}
<h1>New screening</h1>
<p style="color:var(--muted); margin-bottom:24px;">
  Upload a fundus photograph to classify diabetic retinopathy severity and
  generate a Grad-CAM explanation and PDF report.
</p>

<div class="card" style="max-width:560px;">
  <form method="POST" action="{{ url_for('predict') }}" enctype="multipart/form-data" id="predict-form">

    <div class="field">
      <label for="patient">Patient name</label>
      <input type="text" id="patient" name="patient" placeholder="e.g. Ramesh Kumar" required>
    </div>

    <div class="field">
      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="0" max="120" placeholder="e.g. 54" required>
    </div>

    <div class="field">
      <label>Fundus image</label>
      <label class="dropzone" for="image">
        <div id="dz-label">Click to choose a retinal image (PNG or JPG)</div>
        <div class="file-name" id="file-name"></div>
        <input type="file" id="image" name="image" accept=".png,.jpg,.jpeg" required>
      </label>
    </div>

    <button type="submit" class="btn btn-primary" style="width:auto; padding:11px 26px;">
      Run screening
    </button>
  </form>
</div>

<script>
  const input = document.getElementById('image');
  const fileName = document.getElementById('file-name');
  input.addEventListener('change', () => {
    fileName.textContent = input.files.length ? input.files[0].name : '';
  });
</script>
{% endblock %}
